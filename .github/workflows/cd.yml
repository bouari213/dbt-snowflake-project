name: CD - Déploiement en PROD

on:
  push:
    branches:
      - uat

jobs:
  dbt-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Installation de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Installation de dbt-snowflake
        run: pip install dbt-snowflake

      - name: Création du profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          dbt_snowflake_project:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                warehouse: ${{ secrets.SNOWFLAKE_PROD_WAREHOUSE }}
                database: ${{ secrets.SNOWFLAKE_PROD_DATABASE }}
                schema: PROD_STAGING
                threads: 4
          EOF

      - name: Installation des packages dbt
        run: dbt deps

      - name: Run dbt en PROD
        run: dbt run --target prod

      - name: Tests dbt en PROD
        run: dbt test --target prod